name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'juliodaal/nyxis'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # changesets/action only OPENS a "Version Packages" PR when
      # there are pending changesets. It never publishes to npm here
      # — publishing is done manually from a local terminal where the
      # maintainer's `npm whoami` credentials and 2FA are handled
      # correctly. See CONTRIBUTING.md for the release flow.
      - name: Create "Version Packages" PR
        uses: changesets/action@v1
        with:
          version: pnpm version
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
